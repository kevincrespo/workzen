spring.application.name=workzen-apirest

# Perfil por defecto en local
spring.profiles.active=local

# Desactivar usuario por defecto de Spring Security
spring.security.user.name=none
spring.security.user.password=none

# Configuracion subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB