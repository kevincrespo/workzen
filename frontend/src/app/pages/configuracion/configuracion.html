<div class="pagina-wrapper">
  <!-- Banner superior -->
  <div class="banner">
    <div class="banner-contenido">
      <div class="banner-icono">
        <i class="fa-solid fa-gear"></i>
      </div>
      <div class="banner-texto">
        <h1 class="banner-titulo">Configuracion</h1>
        <p class="banner-descripcion">Personaliza tu experiencia</p>
      </div>
    </div>
  </div>

  <div class="contenido-pagina">
    <!-- Notificaciones -->
    <div class="card tarjeta-config mb-3">
      <div class="card-body">
        <h3 class="titulo-config">
          <i class="fa-solid fa-bell me-2"></i>Notificaciones
        </h3>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="notifEmail" checked>
          <label class="form-check-label" for="notifEmail">
            Recibir notificaciones por email
          </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="notifTareas" checked>
          <label class="form-check-label" for="notifTareas">
            Avisos de nuevas tareas
          </label>
        </div>
      </div>
    </div>

    <!-- Idioma -->
    <div class="card tarjeta-config mb-3">
      <div class="card-body">
        <h3 class="titulo-config">
          <i class="fa-solid fa-language me-2"></i>Idioma
        </h3>
        <select class="form-select select-config">
          <option selected>Espanol</option>
          <option>English</option>
        </select>
      </div>
    </div>

    <!-- Seguridad -->
    <div class="card tarjeta-config">
      <div class="card-body">
        <h3 class="titulo-config">
          <i class="fa-solid fa-shield me-2"></i>Seguridad
        </h3>
        <button class="btn btn-outline-primary">
          <i class="fa-solid fa-key me-2"></i>Cambiar contraseña
        </button>
      </div>
    </div>
  </div>
</div>
